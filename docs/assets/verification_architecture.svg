<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.dut{fill:#eef2ff;stroke:#3730a3;stroke-width:2;rx:8}.agent{fill:#ecfeff;stroke:#0e7490;stroke-width:2;rx:8}.flow{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.txt{font:16px sans-serif;fill:#0f172a}.small{font:13px sans-serif;fill:#334155}.title{font:22px sans-serif;font-weight:700;fill:#0f172a}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>

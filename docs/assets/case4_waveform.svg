<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <style>.bg{fill:#fff}.grid{stroke:#e2e8f0}.sig{font:14px monospace;fill:#0f172a}.line{stroke:#ea580c;stroke-width:3;fill:none}.mark{stroke:#dc2626;stroke-width:2;stroke-dasharray:5 5}.note{font:13px sans-serif;fill:#334155}.title{font:20px sans-serif;font-weight:700}</style>
